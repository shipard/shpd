# Shipard nginx configuration
#
# Two server blocks:
#   1. Production  — HTTPS, subdomain-based DS resolution
#   2. Development — HTTP, IP address + DS ID prefix in URL
#
# The frontend SPA lives in public/app/ and is served by nginx directly.
# API requests go through PHP (index.php).
#
# URL patterns:
#   Production  — app: /app/          API: /api/v1/...
#   Development — app: /{ds-id}/app/  API: /{ds-id}/api/v1/...

# ─── Production ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name *.shipard.cz;

    root /opt/shipard/shpd/public;
    index index.php;

    # Redirect bare root to the app
    location = / {
        return 301 /app/;
    }

    # Frontend SPA — static files + fallback to index.html
    location /app/ {
        alias /opt/shipard/shpd/public/app/;
        try_files $uri $uri/ /app/index.html;
    }

    location = /app {
        return 301 /app/;
    }

    # API — pass to PHP
    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }
}

# ─── Development ─────────────────────────────────────────────────────────────
#
# In dev mode the app is opened at: http://{ip}/{ds-id}/app/
# The frontend JS detects the DS ID from the URL and prefixes all API
# requests with it: /{ds-id}/api/v1/...
#
# nginx serves frontend assets for /{ds-id}/app/* directly from public/app/
# and forwards everything else (including /{ds-id}/api/v1/...) to PHP.

server {
    listen 80;
    server_name ~^(\d+\.\d+\.\d+\.\d+)$;

    root /opt/shipard/shpd/public;
    index index.php;

    # Frontend SPA at /{ds-id}/app/ — served directly by nginx
    # Matches: /xxxx-xxxx-xxxx-xxxx/app/ and any path below it
    location ~* "^/[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}/app/(.*)$" {
        alias /opt/shipard/shpd/public/app/$1;
        try_files $uri /app/index.html;
    }

    # Redirect /{ds-id}/app (no trailing slash)
    location ~* "^/([a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4})/app$" {
        return 301 /$1/app/;
    }

    # Everything else (including /{ds-id}/api/v1/...) goes to PHP
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }
}
