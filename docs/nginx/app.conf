# Shipard nginx configuration
#
# Two server blocks:
#   1. Production  — HTTPS, subdomain-based DS resolution
#   2. Development — HTTP, IP address + DS ID prefix in URL
#
# The frontend SPA is identical in both: built to public/app/, served at /app/.
# API paths differ:
#   Production : /api/v1/...
#   Development: /{ds-id}/api/v1/...  (PHP resolves DS from the URL prefix)

# ─── Production ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name *.shipard.cz;

    root /opt/shipard/shpd/public;
    index index.php;

    # Redirect bare root to the app
    location = / {
        return 301 /app/;
    }

    # Frontend SPA — static files + fallback to index.html for client-side routing
    location /app/ {
        alias /opt/shipard/shpd/public/app/;
        try_files $uri $uri/ /app/index.html;
    }

    # Redirect /app (no trailing slash) so the alias works correctly
    location = /app {
        return 301 /app/;
    }

    # API — pass everything to PHP
    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }
}

# ─── Development ─────────────────────────────────────────────────────────────
#
# URL structure in dev mode:
#   Frontend : http://{ip}/app/
#   API      : http://{ip}/{ds-id}/api/v1/...
#
# The frontend SPA is served the same way as in production.
# API calls from the SPA use /api/v1/... (relative, same origin).
# nginx rewrites /api/ → /{ds-id}/api/ using the X-DS-Id header set by the app,
# OR the SPA is opened via http://{ip}/{ds-id}/app/ and a map variable carries the DS ID.
#
# Simplest dev setup: open the app at http://{ip}/{ds-id}/app/ and configure
# the frontend to include the DS ID prefix in API requests (see docs/frontend.md).
# For local npm run dev, the Vite proxy handles forwarding /api/ to localhost:80.

server {
    listen 80;
    server_name ~^(\d+\.\d+\.\d+\.\d+)$;

    root /opt/shipard/shpd/public;
    index index.php;

    # Redirect bare root to the app (no DS ID context here — use /{ds-id}/app/ instead)
    location = / {
        return 301 /app/;
    }

    # Frontend SPA at /app/ (production-style, no DS ID prefix)
    location /app/ {
        alias /opt/shipard/shpd/public/app/;
        try_files $uri $uri/ /app/index.html;
    }

    location = /app {
        return 301 /app/;
    }

    # Frontend SPA scoped to a specific DS ID: /{ds-id}/app/
    # PHP does NOT handle /app paths — nginx serves them directly.
    location ~* ^/([a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4})/app(/.*)?$ {
        alias /opt/shipard/shpd/public/app/;
        # Capture the path within /app/ and try to serve it; fall back to index.html
        try_files $2 $2/ /app/index.html;
    }

    # API — all other paths go to PHP (includes /{ds-id}/api/v1/...)
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }
}
