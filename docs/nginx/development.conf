# ─── Development ─────────────────────────────────────────────────────────────
#
# In dev mode the app is opened at: http://{ip}/{ds-id}/app/
# The frontend JS detects the DS ID from the URL and prefixes all API
# requests with it automatically: /{ds-id}/api/v1/...
#
# How assets work:
#   Vite builds with base: '/app/' so index.html references /app/assets/...
#   When user opens /{ds-id}/app/, nginx serves index.html from public/app/.
#   The browser then requests /app/assets/xxx.js (absolute path from HTML).
#   The /app/ location serves these directly from public/app/.
#   API requests go to /{ds-id}/api/v1/... which PHP handles normally.

server {
    listen 80;
    server_name ~^(\d+\.\d+\.\d+\.\d+)$;

    root /opt/shipard/shpd/public;
    index index.php;

    # Versioned system parameters — updated via git pull + nginx reload
    # (no shipard-tls.conf here — TLS/HSTS belongs only in 443 ssl blocks)
    include /opt/shipard/shpd/docs/nginx/shipard-common.conf;

    # Serve /app/ assets directly (JS, CSS, images from Vite build)
    # This handles both production-style /app/ access and asset loading
    # from /{ds-id}/app/index.html (which references /app/assets/...)
    location /app/ {
        root /opt/shipard/shpd/public;
        try_files $uri /app/index.html;
    }

    location = /app {
        return 301 /app/;
    }

    # Serve /{ds-id}/app/ — strip ds-id prefix, serve from public/app/
    # Only index.html needs this — assets use absolute /app/ paths
    location ~* "^/[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}/app" {
        rewrite "^/[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}/app(/.*)?$" /app$1 last;
    }

    # Everything else (including /{ds-id}/api/v1/...) goes to PHP
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM (install-packages.sh replaces the socket with the shipard pool)
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }
}
